name: Prefetch metrics validation

on:
  push:
    branches: ['ci/prefetch-metrics-*']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install pytest numpy pyyaml prometheus-client pyzmq nvidia-cuda-runtime-cu12
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Make CUDA runtime library visible
        run: echo "LD_LIBRARY_PATH=$(python -c 'import nvidia.cuda_runtime as c; print(next(iter(c.__path__)) + "/lib")'):${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Run prefetch control tests
        env:
          PYTHONPATH: '.:tests:tests/prefetch'
        # Upstream's prefix-admission tests import the native extension and run in the native job.
        run: python -m pytest --confcutdir=tests/prefetch --ignore=tests/prefetch/test_prefix_admission.py tests/prefetch -q
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.9.3
      - run: ruff check flexkv/kvtask.py flexkv/metrics/collector.py flexkv/prefetch/coordinator.py tests/prefetch/test_prefetch_metrics.py
